---
# Where VCF Operations sends alerts: the rulebook's vcfops webhook on the run host (port 5080 must be reachable from
# the VCF Ops appliance), and the VCF Ops API for setup/vcfops.yml.
dsgrow_eda_host: "{{ dsgrow_site.run_host }}"
dsgrow_eda_vcfops_port: 5080
# http (the default) or https: the scheme VCF Operations' webhook plugin uses for the URL above. https only behind a TLS
# proxy on the run host (README "Security notes"): the rulebook's own source speaks plain HTTP.
# dsgrow_eda_vcfops_scheme: https
dsgrow_vcfops_url: https://ops.example.lab/suite-api
# setup/vcfops*.yml, demo/ and the ops_* probes send the VCF Operations administrator's credentials to dsgrow_vcfops_url:
# verify its certificate (default true). A lab with a self-signed certificate says false HERE, visibly, not in the code.
dsgrow_vcfops_validate_certs: true
# setup/vcfops_interval.yml: collect the demo vCenter every minute instead of 5 (a demo alert within ~1 minute)
dsgrow_vcfops_interval_adapter: vcenter01.example.lab
dsgrow_vcfops_interval_min: 1
