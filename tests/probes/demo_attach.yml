---
# READ-ONLY: where demo/init.yml would connect the demo volume (demo/tasks/attach_target.yml): each demo ESXi host's
# NVMe host NQN (esxcli over SSH), its FlashArray host object, and host group or private connections.
#   bash tools/probe.sh tests/probes/demo_attach.yml
- name: Demo - where the volume would be connected
  hosts: localhost
  gather_facts: false
  vars_files:
    - /work/playbooks/group_vars/all/dsgrow.yml
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/site.yml"
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/vcenters.yml"
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/flasharrays.yml"
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/demo.yml"
    - /work/demo/vars/demo.yml
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/lab.yml"
    - "{{ dsgrow_lab.secrets_file }}"
  module_defaults:
    group/community.vmware.vmware: &dd_vc_args
      hostname: "{{ dd_vc.hostname }}"
      username: "{{ dd_admin }}"
      password: "{{ dsgrow_lab_vc_admin_password }}"
      validate_certs: false
    dsgrow_datastore_backing: *dd_vc_args
    group/everpure.flasharray.everpure.flasharray:
      fa_url: "{{ dd_fa_url }}"
      api_token: "{{ dsgrow_fa_token }}"
      disable_warnings: true
  tasks:
    - name: Load the dsgrow secrets
      ansible.builtin.include_tasks: /work/setup/tasks/secrets_load.yml

    - name: Read the demo's objects
      ansible.builtin.include_tasks: /work/demo/tasks/read.yml

    - name: Where the volume goes
      ansible.builtin.include_tasks: /work/demo/tasks/attach_target.yml
