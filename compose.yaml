# dsgrow on the run host. Host network: a lab DNS may live in Docker's default bridge range, VCF Ops posts to
# <run host>:5080, the bridge reaches the approvals source on loopback.
# Secrets: .state/eda.env and .state/bridge.env (mode 0600, rendered by setup/deploy.yml from the dsgrow vault; never
# committed). The bridge's file holds only Slack and the approvals source; vCenter and array secrets only the eda's.
#   docker compose up -d rulebook bridge          the demo services
#   docker compose run --rm -T eda <command>      lint, tests, probes, setup playbooks
x-eda: &eda
  image: dsgrow-eda:1
  build:
    context: docker
    dockerfile: eda.Dockerfile
    network: host
  network_mode: host
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /work
  volumes:
    - ./:/work
  environment:
    HOME: /work/.state/home
    ANSIBLE_CONFIG: /work/ansible.cfg
    ANSIBLE_INVENTORY: /work/environments/${DSGROW_ENV:?set DSGROW_ENV in .env (see .env.example)}/inventory
    DSGROW_STATE_DIR: /work/state

services:
  eda:
    <<: *eda
    profiles: [tools]
    stdin_open: true
    tty: true

  rulebook:
    <<: *eda
    env_file: .state/eda.env
    restart: unless-stopped
    # The network-facing service (5080 on every interface): the code is read-only, state/ (request files and locks) is
    # the only writable path, .state/ (the vault password, the env files) is not visible at all (it reaches the
    # container only as environment variables), and it keeps no capability. The tools service (eda) is the one that
    # needs the whole tree.
    volumes:
      - ./:/work:ro
      - ./state:/work/state
    tmpfs:
      - /work/.state
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOME: /tmp/dsgrow-home
      ANSIBLE_CONFIG: /work/ansible.cfg
      ANSIBLE_INVENTORY: /work/environments/${DSGROW_ENV:?set DSGROW_ENV in .env (see .env.example)}/inventory
      DSGROW_STATE_DIR: /work/state
      # the address the vcfops source listens on (the run host's .env; empty = every interface)
      DSGROW_EDA_VCFOPS_BIND: ${DSGROW_EDA_VCFOPS_BIND:-0.0.0.0}
    command:
      - ansible-rulebook
      - --rulebook
      - rulebooks/datastore_capacity.yml
      - --inventory
      - environments/${DSGROW_ENV:?set DSGROW_ENV in .env (see .env.example)}/inventory
      - --vars
      - rulebooks/vars.yml
      - --env-vars
      - DSGROW_EDA_VCFOPS_TOKEN,DSGROW_EDA_APPROVALS_TOKEN,DSGROW_APPROVAL_HMAC_SECRET,DSGROW_EDA_VCFOPS_BIND
      - --verbose

  bridge:
    image: dsgrow-bridge:1
    build:
      context: .
      dockerfile: docker/bridge.Dockerfile
      network: host
    network_mode: host
    env_file: .state/bridge.env
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
