[defaults]
# Paths are relative to this file. ansible-rulebook's run_playbook copies only playbooks/ into a temp project, so
# roles, modules and filters are found through ANSIBLE_CONFIG=/work/ansible.cfg (set in compose.yaml).
inventory = inventory/vcf9-1
roles_path = roles
library = plugins/modules
filter_plugins = plugins/filter
collections_path = /usr/share/ansible/collections
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false
host_key_checking = true
nocows = true
