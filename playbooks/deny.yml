---
# Records a denial. Run by the rulebook's `denied` rule for a dsgrow.approval.v1 event with decision `deny` from the
# `approvals` source (the Slack bridge: loopback + token + HMAC). Changes no infrastructure and sends nothing to Slack
# (the bridge already rewrote the message): it writes status `denied`, who and when, into the request file, so that no
# approval of that request can grow anything afterwards (execute.yml refuses a denied request; CLAUDE.md rules 4, 6).
# The lock stays: no new proposal for the datastore until the request expires, as the Slack message says.
# A request that was already acted on (executing, done, cleared, ...) is left exactly as it is.
# In: ansible_eda.event (payload: dsgrow.approval.v1, decision deny, meta.source.name: approvals).
- name: Record a denied datastore expansion
  hosts: localhost
  gather_facts: false
  vars:
    dsgrow_denial: "{{ ansible_eda.event.payload | default({}) }}"
    dsgrow_event_source: "{{ ansible_eda.event.meta.source.name | default('') }}"
  tasks:
    - name: Deny
      block:
        - name: The event is a denial from the bridge
          ansible.builtin.assert:
            that:
              - dsgrow_event_source == 'approvals'
              - dsgrow_denial.schema | default('') == 'dsgrow.approval.v1'
              - dsgrow_denial.decision | default('') == 'deny'
              - dsgrow_denial.rid | default('') is string
              - dsgrow_denial.approver_id | default('') is match('^[UW][A-Z0-9]{2,20}$')
            fail_msg: "not a valid denial event (source {{ dsgrow_event_source }}, schema {{ dsgrow_denial.schema | default('?') }})"
            quiet: true

        - name: Denial figures
          ansible.builtin.set_fact:
            dsgrow_rid: "{{ dsgrow_denial.rid }}"
            dsgrow_approver_id: "{{ dsgrow_denial.approver_id }}"
            dsgrow_approver_name: "{{ dsgrow_denial.approver_name | default('') | string | truncate(80) }}"

        - name: The request propose.yml wrote
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: request_read

        - name: The denial matches the request and comes from an approver (rules 4, 6)
          ansible.builtin.assert:
            that:
              - dsgrow_denial.vc | default('') == dsgrow_request.vc
              - dsgrow_denial.ds | default('') == dsgrow_request.ds
              - dsgrow_denial.dev | default('') == dsgrow_request.dev
              - dsgrow_approver_id in dsgrow_approver_ids
            fail_msg: >-
              denial of request {{ dsgrow_rid }} refused:
              {% if dsgrow_denial.vc | default('') != dsgrow_request.vc or dsgrow_denial.ds | default('') != dsgrow_request.ds
                    or dsgrow_denial.dev | default('') != dsgrow_request.dev %}identifiers differ from the request;
              {% endif %}{% if dsgrow_approver_id not in dsgrow_approver_ids %}{{ dsgrow_approver_id }} is not an approver;{% endif %}
            quiet: true

        - name: Only an open request can be denied
          ansible.builtin.debug:
            msg: "request {{ dsgrow_rid }} is {{ dsgrow_request.status }}, not open: the denial changes nothing"
          when: dsgrow_request.status not in ['proposed', 'failed']

        - name: Stop, nothing to deny
          ansible.builtin.meta: end_host
          when: dsgrow_request.status not in ['proposed', 'failed']

        - name: Mark the request denied
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: request_write
          vars:
            dsgrow_request_update:
              status: denied
              denied:
                approver_id: "{{ dsgrow_approver_id }}"
                approver_name: "{{ dsgrow_approver_name }}"
                denied_at: "{{ now(utc=true).isoformat() }}"
                event_uuid: "{{ ansible_eda.event.meta.uuid | default('') }}"

        - name: Denied
          ansible.builtin.debug:
            msg: "request {{ dsgrow_rid }} ({{ dsgrow_request.ds }}) denied by {{ dsgrow_approver_id }} {{ dsgrow_approver_name }}"

      rescue:
        - name: Fail the run
          ansible.builtin.fail:
            msg: >-
              deny.yml failed: {{ ansible_failed_result.msg | default('?') }}
              (step: {{ ansible_failed_task.name | default('?') }})
