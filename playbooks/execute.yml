---
# THE ONLY WRITER. Run by the rulebook's `approved` rule for a dsgrow.approval.v1 event from the `approvals` source
# (the Slack bridge, loopback + token + HMAC). Trusts nothing in the event but identifiers and the target bytes, and
# checks those against the request file propose.yml wrote (CLAUDE.md rules 4-6, 11), then re-runs the full preflight:
#   request + expiry + approver + lock -> resolve -> preflight -> FA extend to absolute bytes -> rescan -> VMFS expand
#   -> refresh -> verify -> Slack
# A rerun with the same approval finishes a partial run: the FA step is skipped when the volume is already at target.
# In: ansible_eda.event (payload: dsgrow.approval.v1, meta.source.name: approvals).
- name: Execute an approved datastore expansion
  hosts: localhost
  gather_facts: false
  vars:
    dsgrow_approval: "{{ ansible_eda.event.payload | default({}) }}"
    dsgrow_event_source: "{{ ansible_eda.event.meta.source.name | default('') }}"
  tasks:
    - name: Execute
      block:
        - name: The event is an approval from the bridge
          ansible.builtin.assert:
            that:
              - dsgrow_event_source == 'approvals'
              - dsgrow_approval.schema | default('') == 'dsgrow.approval.v1'
              - dsgrow_approval.decision | default('') == 'approve'
              - dsgrow_approval.rid | default('') is string
              - dsgrow_approval.tgt | default(0) | int > 0
              - dsgrow_approval.tgt | string is match('^[0-9]+$')
              - dsgrow_approval.approver_id | default('') is match('^[UW][A-Z0-9]{2,20}$')
            fail_msg: "not a valid approval event (source {{ dsgrow_event_source }}, schema {{ dsgrow_approval.schema | default('?') }})"
            quiet: true
          tags: [preflight]

        - name: Approval figures
          ansible.builtin.set_fact:
            dsgrow_rid: "{{ dsgrow_approval.rid }}"
            dsgrow_target_bytes: "{{ dsgrow_approval.tgt | int }}"
            dsgrow_approver_id: "{{ dsgrow_approval.approver_id }}"
            dsgrow_approver_name: "{{ dsgrow_approval.approver_name | default('') | string | truncate(80) }}"

        - name: The request propose.yml wrote
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: request_read

        - name: The approval matches the request, is in time and from an approver (rules 4-6)
          ansible.builtin.assert:
            that:
              - dsgrow_approval.vc | default('') == dsgrow_request.vc
              - dsgrow_approval.ds | default('') == dsgrow_request.ds
              - dsgrow_approval.dev | default('') == dsgrow_request.dev
              - dsgrow_request.status in ['proposed', 'executing', 'failed', 'done']
              - not (dsgrow_request.expires | dsgrow_request_expired(now(utc=true).timestamp() | int))
              - dsgrow_approver_id in dsgrow_approver_ids
              # one request, one approved size: a request that is executing or done carries the target it was approved
              # for, and only that target is accepted again (a failed one may be approved again with any size)
              - dsgrow_request.status not in ['executing', 'done'] or dsgrow_recorded_target | int == dsgrow_target_bytes | int
            fail_msg: >-
              approval for request {{ dsgrow_rid }} refused:
              {% if dsgrow_approval.vc | default('') != dsgrow_request.vc or dsgrow_approval.ds | default('') != dsgrow_request.ds
                    or dsgrow_approval.dev | default('') != dsgrow_request.dev %}identifiers differ from the request;
              {% endif %}{% if dsgrow_request.status not in ['proposed', 'executing', 'failed', 'done'] %}request is {{ dsgrow_request.status }};
              {% endif %}{% if dsgrow_request.expires | dsgrow_request_expired(now(utc=true).timestamp() | int) %}request expired;
              {% endif %}{% if dsgrow_approver_id not in dsgrow_approver_ids %}{{ dsgrow_approver_id }} is not an approver;
              {% endif %}{% if dsgrow_request.status in ['executing', 'done'] and dsgrow_recorded_target | int != dsgrow_target_bytes | int %}request is
              {{ dsgrow_request.status }} for {{ dsgrow_recorded_target | int | dsgrow_human_bytes }}, not for
              {{ dsgrow_target_bytes | dsgrow_human_bytes }} (one request, one approved size);{% endif %}
            quiet: true
          vars:
            dsgrow_recorded_target: "{{ (dsgrow_request.approval | default({})).target_bytes | default(0) }}"
          tags: [preflight]

        - name: The vCenter of the request
          ansible.builtin.set_fact:
            dsgrow_vc: "{{ dsgrow_vcenters | selectattr('hostname', 'equalto', dsgrow_request.vc) | first }}"
            dsgrow_datastore_name: "{{ dsgrow_request.ds }}"

        # A replay (a form opened before the first click, a resent event) of the approval a finished request already
        # carries changes nothing: no rescan, no write, no new result (finding 4; CLAUDE.md "at target it does nothing").
        # The one thing it may do is state hygiene: a run killed between "Done" and the lock release left the lock
        # `executing` (blocking proposals until it expires); this request's own lock is released, nobody else's.
        - name: Already done with this very target
          when: dsgrow_request.status == 'done'
          block:
            - name: The datastore's lock
              ansible.builtin.include_role:
                name: dsgrow_state
                tasks_from: lock_read

            - name: Release the lock this finished request still holds
              ansible.builtin.include_role:
                name: dsgrow_state
                tasks_from: lock_write
              vars:
                dsgrow_lock_new: {rid: "{{ dsgrow_rid }}", status: released, expires: 0}
              when: dsgrow_lock.rid | default('') == dsgrow_rid and dsgrow_lock.status | default('') == 'executing'

            - name: Nothing to do
              ansible.builtin.debug:
                msg: >-
                  request {{ dsgrow_rid }} is already done for {{ dsgrow_target_bytes | dsgrow_human_bytes }}: nothing to do
                  (approval by {{ dsgrow_approver_id }})

        - name: Stop, nothing to do
          ansible.builtin.meta: end_host
          when: dsgrow_request.status == 'done'

        - name: The datastore's lock
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: lock_read

        # one writer per datastore: another request in flight, or demo/cleanup.yml removing it (status cleaning)
        - name: Nobody else holds the datastore (rule 5)
          ansible.builtin.assert:
            that: not (dsgrow_lock_held | bool and dsgrow_lock.rid | default('') != dsgrow_rid)
            fail_msg: >-
              {{ dsgrow_datastore_name }} is locked by {{ dsgrow_lock.rid | default('?') }} ({{ dsgrow_lock.status | default('?') }}):
              not executing request {{ dsgrow_rid }}
            quiet: true
          tags: [preflight]

        - name: Mark the request executing
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: request_write
          vars:
            dsgrow_request_update:
              status: executing
              approval:
                target_bytes: "{{ dsgrow_target_bytes | int }}"
                approver_id: "{{ dsgrow_approver_id }}"
                approver_name: "{{ dsgrow_approver_name }}"
                received_at: "{{ ansible_eda.event.meta.received_at | default(now(utc=true).isoformat()) }}"
                event_uuid: "{{ ansible_eda.event.meta.uuid | default('') }}"

        - name: Hold the lock while executing
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: lock_write
          vars:
            dsgrow_lock_new: {rid: "{{ dsgrow_rid }}", status: executing, expires: "{{ dsgrow_request.expires | int }}"}

        - name: From here a failure belongs to this request
          ansible.builtin.set_fact:
            dsgrow_started: true

        - name: Started (thread)
          ansible.builtin.include_role:
            name: dsgrow_slack
            tasks_from: api
          vars:
            dsgrow_slack_method: chat.postMessage
            dsgrow_slack_body:
              channel: "{{ dsgrow_request.slack.channel }}"
              thread_ts: "{{ dsgrow_request.slack.ts }}"
              text: >-
                :gear: Expansion to {{ dsgrow_target_bytes | dsgrow_human_bytes }} approved by <@{{ dsgrow_approver_id }}>:
                running the preflight again{{ ' (check mode)' if ansible_check_mode else '' }}.
          tags: [slack]

        - name: Resolve the datastore again (nothing from the proposal is reused)
          ansible.builtin.include_role:
            name: dsgrow_resolve
          tags: [preflight, vsphere, flasharray]

        - name: Same device as proposed
          ansible.builtin.assert:
            that: dsgrow_device == dsgrow_request.dev
            fail_msg: "{{ dsgrow_datastore_name }} is now on {{ dsgrow_device }}, the request was for {{ dsgrow_request.dev }}"
            quiet: true
          tags: [preflight]

        - name: Preflight with the approved target
          ansible.builtin.include_role:
            name: dsgrow_preflight
          vars:
            dsgrow_preflight_mode: execute
          tags: [preflight]

        - name: Extend the FlashArray volume
          ansible.builtin.include_role:
            name: dsgrow_flasharray
            tasks_from: extend
          tags: [flasharray]

        - name: Rescan, expand and verify VMFS
          ansible.builtin.include_role:
            name: dsgrow_vmfs
          tags: [vsphere]

        - name: Done
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: request_write
          vars:
            dsgrow_request_update:
              status: done
              result:
                volume_before_bytes: "{{ dsgrow_fa_before_bytes | int }}"
                volume_after_bytes: "{{ dsgrow_fa_after_bytes | int }}"
                vmfs_before_bytes: "{{ dsgrow_vmfs_before_bytes | int }}"
                vmfs_after_bytes: "{{ dsgrow_vmfs_after_bytes | int }}"
                fa_extended: "{{ dsgrow_fa_needs_extend | bool }}"
                hosts: "{{ dsgrow_backing.hosts | map(attribute='name') | list }}"
                finished_at: "{{ now(utc=true).isoformat() }}"

        - name: Release the lock
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: lock_write
          vars:
            dsgrow_lock_new: {rid: "{{ dsgrow_rid }}", status: released, expires: 0}

        # The work is done and written down: telling Slack is best effort. An error here must NOT reach the rescue
        # below, which would rewrite a finished request as `failed`, post "VMFS was not expanded" and put the buttons
        # back on an expanded datastore (finding 5). The request file stays the audit record.
        - name: Tell Slack the result
          block:
            - name: Final message
              ansible.builtin.set_fact:
                dsgrow_slack_status: >-
                  :white_check_mark: *Expanded* by <@{{ dsgrow_approver_id }}>: FlashArray
                  {{ dsgrow_fa_array.name }} / {{ dsgrow_fa_volume_name | dsgrow_slack_escape }}
                  {{ dsgrow_fa_before_bytes | dsgrow_human_bytes }} → {{ dsgrow_fa_after_bytes | dsgrow_human_bytes }}{{
                  '' if dsgrow_fa_needs_extend | bool else ' (already at target)' }};
                  VMFS {{ dsgrow_vmfs_before_bytes | dsgrow_human_bytes }} → {{ dsgrow_vmfs_after_bytes | dsgrow_human_bytes }}
                  on {{ dsgrow_backing.hosts | map(attribute='name') | join(', ') }}.

            - name: Status blocks
              ansible.builtin.include_role:
                name: dsgrow_slack
                tasks_from: status
              tags: [slack]

            - name: Update the proposal
              ansible.builtin.include_role:
                name: dsgrow_slack
                tasks_from: api
              vars:
                dsgrow_slack_method: chat.update
                dsgrow_slack_body:
                  channel: "{{ dsgrow_request.slack.channel }}"
                  ts: "{{ dsgrow_request.slack.ts }}"
                  text: "{{ dsgrow_datastore_name }} expanded to {{ dsgrow_vmfs_after_bytes | dsgrow_human_bytes }}"
                  blocks: "{{ dsgrow_slack_blocks }}"
              tags: [slack]

            - name: Result (thread)
              ansible.builtin.include_role:
                name: dsgrow_slack
                tasks_from: api
              vars:
                dsgrow_slack_method: chat.postMessage
                dsgrow_slack_body:
                  channel: "{{ dsgrow_request.slack.channel }}"
                  thread_ts: "{{ dsgrow_request.slack.ts }}"
                  text: "{{ dsgrow_slack_status }}"
              tags: [slack]
          rescue:
            - name: Slack was not told (the expansion is done and recorded)
              ansible.builtin.debug:
                msg: >-
                  request {{ dsgrow_rid }} is done ({{ dsgrow_datastore_name }}), but Slack was not fully updated:
                  {{ (ansible_failed_result.msg | default('?')) | string | truncate(500) }}

        - name: Job artifacts
          ansible.builtin.set_stats:
            data:
              dsgrow_request_id: "{{ dsgrow_rid }}"
              dsgrow_datastore: "{{ dsgrow_datastore_name }}"
              dsgrow_approver: "{{ dsgrow_approver_id }} {{ dsgrow_approver_name }}"
              dsgrow_volume_before_bytes: "{{ dsgrow_fa_before_bytes | int }}"
              dsgrow_volume_after_bytes: "{{ dsgrow_fa_after_bytes | int }}"
              dsgrow_vmfs_before_bytes: "{{ dsgrow_vmfs_before_bytes | int }}"
              dsgrow_vmfs_after_bytes: "{{ dsgrow_vmfs_after_bytes | int }}"
              dsgrow_hosts: "{{ dsgrow_backing.hosts | map(attribute='name') | list }}"

      rescue:
        - name: The failure
          ansible.builtin.set_fact:
            dsgrow_failure: >-
              {{ (ansible_failed_result.msg | default('unknown error')) | string | truncate(2500) }}
              (step: {{ ansible_failed_task.name | default('?') }})

        # A refusal before "dsgrow_started" (bad event, unknown request, expired, not an approver) changes no state:
        # it only gets a thread note. A failure after it marks the request failed, releases the lock and offers the
        # buttons again (approving again finishes a partial run).
        - name: Record the failure in the request
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: request_write
          vars:
            dsgrow_request_update:
              status: failed
              failure: "{{ dsgrow_failure }}"
              failed_at: "{{ now(utc=true).isoformat() }}"
          when: dsgrow_started | default(false)

        - name: Release the lock (a new alert may propose again)
          ansible.builtin.include_role:
            name: dsgrow_state
            tasks_from: lock_write
          vars:
            dsgrow_lock_new: {rid: "{{ dsgrow_rid }}", status: failed, expires: 0}
          when: dsgrow_started | default(false)

        - name: Failure text
          ansible.builtin.set_fact:
            dsgrow_slack_status: >-
              {% if dsgrow_started | default(false) %}:x: *Expansion failed*: {{ dsgrow_failure | dsgrow_slack_escape }}
              {% if dsgrow_fa_after_bytes is defined and dsgrow_fa_needs_extend | default(false) | bool %}The FlashArray
              volume is at {{ dsgrow_fa_after_bytes | dsgrow_human_bytes }} and VMFS was not expanded: a safe state (the new
              space is unused); approving again finishes the job.{% elif dsgrow_fa_after_bytes is defined %}The
              FlashArray volume was already at target; approving again retries the VMFS step.{% else %}Nothing was
              changed.{% endif %}{% else %}:no_entry: Approval refused, nothing changed:
              {{ dsgrow_failure | dsgrow_slack_escape }}{% endif %}

        - name: Report the failure in the thread
          ansible.builtin.include_role:
            name: dsgrow_slack
            tasks_from: api
          vars:
            dsgrow_slack_method: chat.postMessage
            dsgrow_slack_body:
              channel: "{{ dsgrow_request.slack.channel }}"
              thread_ts: "{{ dsgrow_request.slack.ts }}"
              text: "{{ dsgrow_slack_status }}"
          when: dsgrow_request.slack is defined

        - name: Offer the buttons again after a failed run
          when: dsgrow_started | default(false) and dsgrow_request.slack is defined
          block:
            - name: Status blocks with the buttons
              ansible.builtin.include_role:
                name: dsgrow_slack
                tasks_from: status
              vars:
                dsgrow_slack_keep_actions: true

            - name: Update the proposal
              ansible.builtin.include_role:
                name: dsgrow_slack
                tasks_from: api
              vars:
                dsgrow_slack_method: chat.update
                dsgrow_slack_body:
                  channel: "{{ dsgrow_request.slack.channel }}"
                  ts: "{{ dsgrow_request.slack.ts }}"
                  text: "Expansion of {{ dsgrow_request.ds }} failed"
                  blocks: "{{ dsgrow_slack_blocks }}"

        # An approval that arrives after a denial (a Custom form opened before it) makes the bridge print "Approved" over
        # "Denied". This run refused it; put the truth back in the message (best effort, never a second failure).
        - name: Put the denial back in the message
          when: dsgrow_request is defined and dsgrow_request.status | default('') == 'denied' and dsgrow_request.slack is defined
          block:
            - name: Denied text
              ansible.builtin.set_fact:
                dsgrow_slack_status: >-
                  :no_entry_sign: *Denied* by <@{{ (dsgrow_request.denied | default({})).approver_id | default('?') }}>.
                  An approval that arrived afterwards was refused: nothing changed.

            - name: Status blocks
              ansible.builtin.include_role:
                name: dsgrow_slack
                tasks_from: status

            - name: Update the proposal
              ansible.builtin.include_role:
                name: dsgrow_slack
                tasks_from: api
              vars:
                dsgrow_slack_method: chat.update
                dsgrow_slack_body:
                  channel: "{{ dsgrow_request.slack.channel }}"
                  ts: "{{ dsgrow_request.slack.ts }}"
                  text: "Denied"
                  blocks: "{{ dsgrow_slack_blocks }}"
          rescue:
            - name: The message could not be corrected
              ansible.builtin.debug:
                msg: "request {{ dsgrow_rid }} is denied; the Slack message could not be corrected"

        - name: Fail the run
          ansible.builtin.fail:
            msg: "{{ dsgrow_failure }}"
