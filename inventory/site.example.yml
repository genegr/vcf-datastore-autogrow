---
# Copy to inventory/<env>/group_vars/dsgrow/site.yml (gitignored) and fill in your addresses.
# Everything else in the inventory refers to these values, so no address lives in git.
dsgrow_site:
  run_host: 192.0.2.10                  # the host running the dsgrow-eda containers; VCF Ops posts alerts to it
  router: 192.0.2.1                     # SSH jump host to the lab networks (demo only)
  fa_url:                               # by dsgrow_flasharrays[].key
    array-a: https://192.0.2.20
    array-b: https://192.0.2.21
  vcenter_ip:                           # by dsgrow_vcenters[].key: what VCF Ops may send as ${ADAPTER_INSTANCE}
    w01: 198.51.100.21
    w02: 198.51.100.25
  esx_ip:                               # management (vmk0) addresses, for the SSH probes
    esx04: 198.51.100.104
  demo_net:                             # the demo VM's static address (demo only)
    ip: 203.0.113.21
    prefix: 24
    gateway: 203.0.113.1
    dns: [203.0.113.1]
    ntp: [203.0.113.1]
