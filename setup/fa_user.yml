---
# Step 2 (LAB CHANGE, gated): a local user `dsgrow` with role storage_admin and an API token on every array in
# dsgrow_flasharrays, the token stored once in .state/secrets/fa-<array>.yml (encrypted).
# Module: everpure.flasharray.purefa_user (the toolbox's 1.46.0; it manages admins, not volumes, so bug #1103 does
# not apply), authenticated with the lab's FlashArray admin token (lab.yml: dsgrow_lab_fa_admin_tokens, read-only use).
# Idempotent: an existing dsgrow user with a stored token is left alone (changed=0); a token is only requested when
# the secrets file does not exist yet.
# Rollback (by hand, the owner; this repo never deletes): Purity GUI Settings > Users, delete `dsgrow`; remove
# .state/secrets/fa-<array>.yml.
#   bash tools/setup.sh setup/fa_user.yml                         dry run (reads, reports what it would do)
#   bash tools/setup.sh setup/fa_user.yml --confirm fa_user.yml   after the owner's go-ahead
- name: Dsgrow API user on the FlashArrays
  hosts: localhost
  gather_facts: false
  vars_files:
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/site.yml"
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/flasharrays.yml"
    - "/work/environments/{{ dsgrow_env }}/inventory/group_vars/dsgrow/lab.yml"
    - "{{ dsgrow_lab.array_secrets_file }}"
  vars:
    fu_user: dsgrow
  tasks:
    - name: Secrets so far
      ansible.builtin.include_tasks: tasks/secrets_load.yml

    - name: One array
      ansible.builtin.include_tasks: tasks/fa_user_one.yml
      loop: "{{ dsgrow_flasharrays }}"
      loop_control:
        loop_var: fu_array
        label: "{{ fu_array.name }}"
