---
# Load every .state/secrets/*.yml (decrypted with vault id dsgrow). Missing files are fine here; each consumer
# asserts what it needs.
- name: Find the dsgrow secrets files
  ansible.builtin.find:
    paths: /work/.state/secrets
    patterns: "*.yml"
  register: dsgrow_secret_files

- name: Load them
  ansible.builtin.include_vars:
    file: "{{ item.path }}"
  loop: "{{ dsgrow_secret_files.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  no_log: true
