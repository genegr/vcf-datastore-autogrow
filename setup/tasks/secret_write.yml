---
# Write one dsgrow secrets file, encrypted under vault id dsgrow, without a plaintext file ever touching the disk
# (ansible-vault reads the YAML from stdin). In: dsgrow_secret_name (file stem), dsgrow_secret_data (dict).
# Skipped in --check. A file that exists is never overwritten (create-once; the owner edits with ansible-vault).
- name: Secrets file {{ dsgrow_secret_name }} exists already
  ansible.builtin.stat:
    path: /work/.state/secrets/{{ dsgrow_secret_name }}.yml
  register: dsgrow_secret_stat

- name: Write .state/secrets/{{ dsgrow_secret_name }}.yml (encrypted)
  ansible.builtin.command:
    argv:
      - ansible-vault
      - encrypt
      - --vault-id
      - dsgrow@/work/.state/vault-pass
      - --encrypt-vault-id
      - dsgrow
      - --output
      - "/work/.state/secrets/{{ dsgrow_secret_name }}.yml"
      - "-"
    stdin: "{{ dsgrow_secret_data | to_nice_yaml }}"
    creates: /work/.state/secrets/{{ dsgrow_secret_name }}.yml
  no_log: true
  when: not dsgrow_secret_stat.stat.exists and not ansible_check_mode

- name: Secrets file is private
  ansible.builtin.file:
    path: /work/.state/secrets/{{ dsgrow_secret_name }}.yml
    mode: "0600"
  when: not ansible_check_mode
