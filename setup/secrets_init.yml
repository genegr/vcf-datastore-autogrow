---
# Step 1 (run host only, no lab system touched): the rulebook's tokens and the approval HMAC secret, random, created
# once into .state/secrets/eda.yml (encrypted). Rerun: changed=0.
#   bash tools/setup.sh setup/secrets_init.yml [--confirm secrets_init.yml]
- name: Dsgrow EDA secrets
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate and store
      ansible.builtin.include_tasks: tasks/secret_write.yml
      vars:
        dsgrow_secret_name: eda
        dsgrow_secret_data:
          dsgrow_secret_eda_vcfops_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
          dsgrow_secret_eda_approvals_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
          dsgrow_secret_approval_hmac_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits']) }}"
