---
# dsgrow secrets live in .state/secrets/*.yml on the run host, each encrypted with ansible-vault under the vault id
# `dsgrow` (password file .state/vault-pass). Nothing here is a real value. Files and who writes them:
#
#   slack.yml          the owner, by hand after creating the Slack app (slack/manifest.yml):
#                        ansible-vault create --vault-id dsgrow@.state/vault-pass .state/secrets/slack.yml
#   eda.yml            setup/secrets_init.yml (random tokens, created once)
#   vcenter-<key>.yml  setup/vcenter_account.yml (generated password of dsgrow@<sso domain>)
#   fa-<array>.yml     setup/fa_user.yml (the API token the array issues for the dsgrow user)
#
# slack.yml
dsgrow_secret_slack_bot_token: xoxb-...              # OAuth & Permissions -> Bot User OAuth Token
dsgrow_secret_slack_app_token: xapp-...              # Basic Information -> App-Level Token (connections:write)
dsgrow_secret_slack_channel: C0123456789             # the demo channel's ID (the bot is invited)
dsgrow_secret_approver_ids: [U0123456789]            # member IDs allowed to approve
# eda.yml
dsgrow_secret_eda_vcfops_token: <random>             # VCF Ops -> rulebook source vcfops (Bearer)
dsgrow_secret_eda_approvals_token: <random>          # bridge -> rulebook source approvals (Bearer)
dsgrow_secret_approval_hmac_secret: <random>         # bridge -> rulebook source approvals (HMAC-SHA256)
# vcenter-w01.yml (one per dsgrow_vcenters[].key)
dsgrow_secret_vc_password_w01: <password of dsgrow@w01.everpure.demo>
# fa-z-x90-a.yml (one per dsgrow_flasharrays[].key, the array's stable alias; its Purity name is z-fastaines-d)
dsgrow_secret_fa_token_z_x90_a: <API token of the dsgrow user on z-fastaines-d>
