---
# Read-only (also in --check): where the demo volume is connected (owner 2026-11-20):
#   1. each demo ESXi host's NVMe host NQN, from vCenter: HostSystem hardware.systemInfo.qualifiedName, the entry of
#      type nvmeQualifiedName (public API since vSphere 7.0 U3; found 2026-11-21, it replaced `esxcli nvme info get`
#      over SSH). The hosts must be NVMe-oF initiators (NVMe/TCP or NVMe/FC); SCSI hosts (iSCSI IQN, FC WWN) are not
#      handled.
#   2. the FlashArray host object that carries that NQN: exactly one per ESXi host
#   3. all of them in ONE host group whose members are exactly these hosts -> connect the volume to that host group;
#      none of them in a host group -> connect it to each host object (private connections); anything else (some in
#      a group, different groups, a group with other hosts too) -> refuse: the volume would reach hosts outside
#      the demo cluster, or be half-presented
# Needs dd_hosts and dd_hgroups (tasks/read.yml). Out: dd_attach = {mode: hgroup, hgroup, hosts, nqns} or
# {mode: hosts, hosts, nqns}.
- name: NVMe host NQN of each demo host, from vCenter (hardware.systemInfo.qualifiedName)
  community.vmware.vmware_host_facts:
    esxi_hostname: "{{ item }}"
    schema: vsphere
    properties: [hardware.systemInfo]
  loop: "{{ dd.esx_hosts }}"
  register: da_facts
  check_mode: false

- name: Each ESXi host's NQN and its host object on {{ dd.array }}
  ansible.builtin.set_fact:
    da_map: >-
      {% set out = [] %}{% for r in da_facts.results %}
      {%- set qn = ((r.ansible_facts | default({})).hardware | default({})).systemInfo | default({}) %}
      {%- set m = qn.qualifiedName | default([], true) | selectattr('type', 'equalto', 'nvmeQualifiedName')
                  | map(attribute='value') | list %}
      {%- set nqn = m[0] if m else '' %}
      {%- set fa = [] %}{% for n, h in dd_hosts.items() %}{% if nqn and nqn in (h.nqn | default([]) or []) %}{% set _ = fa.append(n) %}{% endif %}{% endfor %}
      {%- set _ = out.append({'esx': r.item, 'nqn': nqn, 'fa_hosts': fa,
                              'hgroup': ((dd_hosts[fa[0]].hgroup | default('', true)) if fa | length == 1 else '')}) %}
      {%- endfor %}{{ out }}

- name: Host group or host objects
  ansible.builtin.set_fact:
    da_problems: >-
      {% set out = [] %}{% for e in da_map %}
      {%- if not e.nqn %}{% set _ = out.append(e.esx ~ ': vCenter reports no nvmeQualifiedName (not an NVMe-oF initiator, or older than vSphere 7.0 U3)') %}
      {%- elif e.fa_hosts | length != 1 %}
      {%- set _ = out.append(e.esx ~ ' (' ~ e.nqn ~ ') is carried by ' ~ e.fa_hosts | length ~ ' host objects on ' ~ dd.array ~ ' ' ~ e.fa_hosts) %}{% endif %}
      {%- endfor %}
      {%- if not out %}
      {%- set hosts = da_map | map(attribute='fa_hosts') | map('join', ',') | list | sort %}
      {%- set groups = da_map | map(attribute='hgroup') | unique | list %}
      {%- if groups | length > 1 %}
      {%- set _ = out.append('the host objects are in different host groups (or some in none): ' ~ dict(hosts | zip(da_map | map(attribute='hgroup')))) %}
      {%- elif groups[0] and (dd_hgroups.get(groups[0], {}).hosts | default([]) | sort) != hosts %}
      {%- set _ = out.append('host group ' ~ groups[0] ~ ' has hosts ' ~ dd_hgroups.get(groups[0], {}).hosts | default([]) ~ ', not exactly ' ~ hosts) %}{% endif %}
      {%- endif %}{{ out }}
    dd_attach: >-
      {% set hosts = da_map | map(attribute='fa_hosts') | map('join', ',') | list | sort %}
      {%- set groups = da_map | map(attribute='hgroup') | unique | list %}
      {%- set nqns = dict(da_map | map(attribute='esx') | zip(da_map | map(attribute='nqn'))) %}
      {{- {'mode': 'hgroup', 'hgroup': groups[0], 'hosts': hosts, 'nqns': nqns}
          if (groups | length == 1 and groups[0]) else {'mode': 'hosts', 'hosts': hosts, 'nqns': nqns} }}

- name: Where {{ dd.volume }} is connected
  ansible.builtin.assert:
    that: da_problems | length == 0
    fail_msg: "cannot tell where to connect {{ dd.volume }}: {{ da_problems }}"
    success_msg: >-
      {{ ('host group ' ~ dd_attach.hgroup ~ ' (exactly ' ~ dd_attach.hosts | join(', ') ~ ')') if dd_attach.mode == 'hgroup'
         else ('each host object, privately (in no host group): ' ~ dd_attach.hosts | join(', ')) }};
      NQNs {{ dd_attach.nqns }}
    quiet: false
