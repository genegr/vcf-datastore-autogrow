---
# ONE-TIME (LAB CHANGE, gated, 2026-11-20): retire the first demo's datastore vcf9-1-w02-demo01 (512 -> 640 GiB),
# built by nested-vcf (lab file w02 datastores, record array-w02.json) and grown by dsgrow, so the demo can start from
# nothing each time (demo/init.yml makes dsgrow-demo01 instead). Removes exactly these, identity-checked first:
#   the filler VM dsgrow-demo-filler (only disks on that datastore), the datastore (unmount + detach on esx07-09),
#   the volume (disconnected from host group vcf9-1-w02, destroyed and eradicated on z-x70-a; serial checked).
# nested-vcf's model is edited separately, by hand (setup/README.md): drop w02-demo01 from labs/vcf9-1.yaml and from
# .state/labs/vcf9-1/array-w02.json (volumes, nguid); then its `--check --tags wld_array,wld_datastore -e wld=w02`.
# Rerun: changed=0. No rollback once eradicated (the owner's choice); before the run the volume is intact.
#   bash tools/setup.sh demo/retire_demo01.yml [--confirm retire_demo01.yml]
- name: Retire vcf9-1-w02-demo01
  hosts: localhost
  gather_facts: false
  vars_files:
    - /work/playbooks/group_vars/all/dsgrow.yml
    - /work/inventory/vcf9-1/group_vars/dsgrow/site.yml
    - /work/inventory/vcf9-1/group_vars/dsgrow/vcenters.yml
    - /work/inventory/vcf9-1/group_vars/dsgrow/flasharrays.yml
    - /work/inventory/vcf9-1/group_vars/dsgrow/demo.yml
    - /work/demo/vars/demo.yml
    - /nvcf/labs/vcf9-1.vault.yml
  vars:
    dr_old:
      datastore: vcf9-1-w02-demo01
      volume: vcf9-1-w02-demo01
      host_group: vcf9-1-w02
      eui: eui.00274318935cf84e24a9372b02e1e7ec      # nested-vcf .state/labs/vcf9-1/array-w02.json nguid
      filler: dsgrow-demo-filler
    dr_rec_file: "{{ dd_dir }}/retire-demo01.json"
  module_defaults:
    group/community.vmware.vmware: &dd_vc_args
      hostname: "{{ dd_vc.hostname }}"
      username: "{{ dd_admin }}"
      password: "{{ vault_sso_admin_password }}"
      validate_certs: false
    dsgrow_datastore_backing: *dd_vc_args
    esx_vmfs_volume: *dd_vc_args
    cluster_ha_heartbeat_info: *dd_vc_args
    cluster_ha_heartbeat_pref: *dd_vc_args
    group/everpure.flasharray.everpure.flasharray:
      fa_url: "{{ dd_fa_url }}"
      api_token: "{{ dsgrow_fa_token }}"
      disable_warnings: true
  tasks:
    - name: Common
      ansible.builtin.include_tasks: tasks/common.yml

    - name: The old datastore
      dsgrow_datastore_backing:
        datacenter: "{{ dd_vc.datacenter }}"
        datastore: "{{ dr_old.datastore }}"
      register: dr_ds
      check_mode: false

    - name: The filler VM
      community.vmware.vmware_guest_info:
        datacenter: "{{ dd_vc.datacenter }}"
        name: "{{ dr_old.filler }}"
      register: dr_filler
      check_mode: false
      failed_when: dr_filler.instance is not defined and (dr_filler.msg | default('')) is not search('non-existing VM')

    - name: The filler's disks
      community.vmware.vmware_guest_disk_info:
        datacenter: "{{ dd_vc.datacenter }}"
        name: "{{ dr_old.filler }}"
      register: dr_filler_disks
      check_mode: false
      when: dr_filler.instance is defined

    - name: "{{ dd.array }}: volumes and host connections"
      everpure.flasharray.purefa_info:
        gather_subset: [volumes, hosts]
      register: dr_fa
      check_mode: false

    - name: What an earlier run of this playbook recorded
      ansible.builtin.slurp:
        src: "{{ dr_rec_file }}"
      register: dr_rec_raw
      failed_when: false
      check_mode: false

    - name: What is there
      ansible.builtin.set_fact:
        dr_has_filler: "{{ dr_filler.instance is defined }}"
        dr_vol: "{{ dr_fa.purefa_info.volumes.get(dr_old.volume, {}) }}"
        dr_has_vol: "{{ dr_old.volume in dr_fa.purefa_info.volumes }}"
        dr_vol_deleted: "{{ dr_old.volume in dr_fa.purefa_info.deleted_volumes | default({}) }}"
        dr_serial: "{{ dr_old.eui | dsgrow_device_to_fa_serial }}"
        dr_trash: "{{ (dr_fa.purefa_info.deleted_volumes | default({})).get(dr_old.volume, {}) }}"
        dr_rec: "{{ (dr_rec_raw.content | b64decode | from_json) if dr_rec_raw.content is defined else {} }}"
        # purefa_info volumes[].hosts lists every member of a connected host group too (one connection per host):
        # a private connection is a host's connection without a host group
        dr_private: >-
          {% set out = [] %}{% for n, h in dr_fa.purefa_info.hosts.items() %}{% for c in h.volumes | default([]) %}
          {%- if c.volume == dr_old.volume and not c.hostgroup %}{% set _ = out.append(n) %}{% endif %}{% endfor %}{% endfor %}{{ out }}

    - name: The old datastore's VMFS UUID (read now, or recorded by an earlier run)
      ansible.builtin.set_fact:
        dr_ds_vmfs_uuid: "{{ dr_ds.datastore.vmfs_uuid if dr_ds.matches == 1 else dr_rec.vmfs_uuid | default('') }}"

    - name: It is the old demo datastore and nothing else
      ansible.builtin.assert:
        that: dr_problems | length == 0
        fail_msg: "refusing to remove anything: {{ dr_problems }}"
        success_msg: >-
          removing: {{ [dr_old.filler if dr_has_filler else none, dr_old.datastore if dr_ds.matches else none,
                        dr_old.volume if (dr_has_vol or dr_vol_deleted) else none] | select | join(', ') or 'nothing (done)' }}
        quiet: false
      vars:
        dr_problems: >-
          {% set out = [] %}
          {%- if dr_ds.matches > 1 %}{% set _ = out.append(dr_ds.matches ~ ' datastores named ' ~ dr_old.datastore) %}{% endif %}
          {%- if dr_ds.matches == 1 %}
          {%- if dr_ds.datastore.extents != [dr_old.eui] %}{% set _ = out.append('extents ' ~ dr_ds.datastore.extents ~ ', want ' ~ dr_old.eui) %}{% endif %}
          {%- if dr_ds.datastore.vms | reject('equalto', dr_old.filler) | list | length > 0 %}{% set _ = out.append('other VMs on it: ' ~ dr_ds.datastore.vms | reject('equalto', dr_old.filler) | list) %}{% endif %}
          {%- if dr_ds.datastore.hosts | map(attribute='name') | reject('in', dd.esx_hosts) | list | length > 0 %}{% set _ = out.append('mounted outside ' ~ dd.esx_hosts) %}{% endif %}
          {%- endif %}
          {%- if dr_has_filler and dr_filler_disks.guest_disk_info.values() | map(attribute='backing_datastore') | reject('equalto', dr_old.datastore) | list | length > 0 %}
          {%- set _ = out.append(dr_old.filler ~ ' has disks outside ' ~ dr_old.datastore) %}{% endif %}
          {%- if dr_has_vol and (dr_vol.serial | upper) != dr_serial %}{% set _ = out.append('volume serial ' ~ dr_vol.serial ~ ', want ' ~ dr_serial) %}{% endif %}
          {%- if dr_has_vol and dr_private | length > 0 %}{% set _ = out.append('private connections to ' ~ dr_private) %}{% endif %}
          {%- if dr_vol_deleted and (dr_trash.serial | default('') | upper) != dr_serial %}
          {%- set _ = out.append('volume in the trash has serial ' ~ dr_trash.serial | default('?') ~ ', want ' ~ dr_serial) %}{% endif %}
          {%- if dr_has_vol and dr_vol.host_groups | default([]) | map(attribute='host_group') | reject('equalto', dr_old.host_group) | list | length > 0 %}
          {%- set _ = out.append('host groups ' ~ dr_vol.host_groups) %}{% endif %}
          {{- out }}

    - name: Delete the filler VM {{ dr_old.filler }}
      community.vmware.vmware_guest:
        datacenter: "{{ dd_vc.datacenter }}"
        uuid: "{{ dr_filler.instance.instance_uuid }}"
        use_instance_uuid: true
        name: "{{ dr_old.filler }}"
        state: absent
        force: true
      when: dr_has_filler

    # HA is changed only for the removal (userSelectedDs on ds01, so HA lets go of the old datastore) and then put back
    # exactly as found; found on w02 2026-11-20: allFeasibleDsWithUserPreference, no preferred datastore
    - name: HA heartbeat settings as found (read)
      cluster_ha_heartbeat_pref:
        cluster: "{{ dd.cluster }}"
        datastores: "{{ dd.ha_heartbeat_datastores }}"
        policy: userSelectedDs
      check_mode: true
      changed_when: false
      register: dr_ha_found

    - name: The settings to put back (recorded by the first run)
      ansible.builtin.set_fact:
        dr_ha_before: "{{ dr_rec.ha_before | default(dr_ha_found.before) }}"

    - name: Record the VMFS UUID and HA settings before anything changes (a rerun after a failure can finish the job)
      ansible.builtin.copy:
        content: >-
          {{ {'datastore': dr_old.datastore, 'vmfs_uuid': dr_ds_vmfs_uuid, 'eui': dr_old.eui, 'forgotten': false,
              'ha_before': dr_ha_before} | to_nice_json(indent=2) }}
        dest: "{{ dr_rec_file }}"
        mode: "0600"
      when: dr_ds.matches == 1 and not dr_rec

    - name: Off the datastore
      when: dr_ds.matches == 1
      block:
        - name: HA heartbeats only on {{ dd.ha_heartbeat_datastores }}
          cluster_ha_heartbeat_pref:
            cluster: "{{ dd.cluster }}"
            datastores: "{{ dd.ha_heartbeat_datastores }}"
            policy: userSelectedDs

        - name: HA no longer heartbeats on {{ dr_old.datastore }}
          cluster_ha_heartbeat_info:
            cluster: "{{ dd.cluster }}"
          register: dr_ha
          until: dr_old.datastore not in (dr_ha.heartbeat_datastores | default({}))
          retries: 30
          delay: 20
          when: not ansible_check_mode

        - name: Unmount and detach on every host
          esx_vmfs_volume:
            esxi_hostname: "{{ item }}"
            vmfs_uuid: "{{ dr_ds_vmfs_uuid }}"
            device: "{{ dr_old.eui }}"
            state: detached
          loop: "{{ dd.esx_hosts }}"
          register: dr_detached

    - name: "{{ dd.array }}: disconnect {{ dr_old.volume }} from host group {{ dr_old.host_group }}"
      everpure.flasharray.purefa_hg:
        name: "{{ dr_old.host_group }}"
        volume: ["{{ dr_old.volume }}"]
        state: absent
      when: dr_has_vol

    - name: "{{ dd.array }}: destroy and eradicate {{ dr_old.volume }}"
      everpure.flasharray.purefa_volume:
        name: "{{ dr_old.volume }}"
        state: absent
        eradicate: true
      register: dr_vol_gone
      when: dr_has_vol or dr_vol_deleted

    # A LUN went away: HBA rescan, no VMFS rescan (owner 2026-11-21, skill vmfs-datastore-expand "When to rescan")
    - name: Rescan so the hosts drop the device
      community.vmware.vmware_host_scanhba:
        esxi_hostname: "{{ item }}"
        rescan_hba: true
        rescan_vmfs: false
        refresh_storage: true
      loop: "{{ dd.esx_hosts }}"
      changed_when: false
      when: not ansible_check_mode and dr_ds_vmfs_uuid | length > 0 and not dr_rec.forgotten | default(false)

    # DeleteScsiLunState succeeds even without an entry: done once, then marked in the record (rerun: changed=0)
    - name: Forget the detached-device entries
      esx_vmfs_volume:
        esxi_hostname: "{{ item }}"
        vmfs_uuid: "{{ dr_ds_vmfs_uuid }}"
        device: "{{ dr_old.eui }}"
        state: forgotten
      loop: "{{ dd.esx_hosts }}"
      when: not ansible_check_mode and dr_ds_vmfs_uuid | length > 0 and not dr_rec.forgotten | default(false)
      register: dr_forgot

    - name: Mark them forgotten in the record
      ansible.builtin.copy:
        content: >-
          {{ {'datastore': dr_old.datastore, 'vmfs_uuid': dr_ds_vmfs_uuid, 'eui': dr_old.eui, 'forgotten': true,
              'ha_before': dr_ha_before} | to_nice_json(indent=2) }}
        dest: "{{ dr_rec_file }}"
        mode: "0600"
      when: dr_forgot is not skipped

    - name: HA back as found ({{ dr_ha_before.policy }}, preferred {{ dr_ha_before.datastores }})
      cluster_ha_heartbeat_pref:
        cluster: "{{ dd.cluster }}"
        datastores: "{{ dr_ha_before.datastores }}"
        policy: "{{ dr_ha_before.policy }}"

    - name: HA read back
      cluster_ha_heartbeat_pref:
        cluster: "{{ dd.cluster }}"
        datastores: "{{ dr_ha_before.datastores }}"
        policy: "{{ dr_ha_before.policy }}"
      check_mode: true
      changed_when: false
      register: dr_ha_back
      when: not ansible_check_mode

    - name: HA is as it was found
      ansible.builtin.assert:
        that: dr_ha_back.before.policy == dr_ha_before.policy
        success_msg: >-
          HA heartbeat policy {{ dr_ha_back.before.policy }}, preferred {{ dr_ha_back.before.datastores }}
          {%- if dr_ha_back.before.datastores != dr_ha_before.datastores %} (found with {{ dr_ha_before.datastores }}: vSphere kept the
          preference; harmless with all feasible datastores){% endif %}
        fail_msg: "HA policy is {{ dr_ha_back.before }}, was {{ dr_ha_before }}"
      when: not ansible_check_mode

    - name: Read back - the datastore
      dsgrow_datastore_backing:
        datacenter: "{{ dd_vc.datacenter }}"
        datastore: "{{ dr_old.datastore }}"
      register: dr_ds_after
      when: not ansible_check_mode

    - name: Read back - the array
      everpure.flasharray.purefa_info:
        gather_subset: [volumes]
      register: dr_fa_after
      when: not ansible_check_mode

    - name: Gone everywhere
      ansible.builtin.assert:
        that:
          - dr_ds_after.matches == 0
          - dr_old.volume not in dr_fa_after.purefa_info.volumes
          - dr_old.volume not in dr_fa_after.purefa_info.deleted_volumes | default({})
        success_msg: "{{ dr_old.datastore }} retired: datastore and volume gone (eradicated)"
        fail_msg: "datastores {{ dr_ds_after.matches }}; volume live {{ dr_old.volume in dr_fa_after.purefa_info.volumes }}"
      when: not ansible_check_mode
